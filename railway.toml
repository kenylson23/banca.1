# Nixpacks configuration for Railway
# Build the app (Vite client + esbuild server); Railway serves the API only

[build]
builder = "NIXPACKS"
buildCommand = "npm install --registry=https://registry.npmjs.org/ --no-audit --no-fund && npm run build"

[deploy]
startCommand = "SERVE_STATIC=false NODE_ENV=production node dist/index.js"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
