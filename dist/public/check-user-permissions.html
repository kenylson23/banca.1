<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Permissões do Usuário</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        .data { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            margin: 10px 0;
        }
        .fix-button {
            background: #28a745;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Verificação de Permissões</h1>
        <p style="color: #666; margin-bottom: 20px;">Verifique suas permissões de acesso ao sistema</p>
        
        <button onclick="checkPermissions()">🔍 Verificar Minhas Permissões</button>
        
        <div id="result"></div>
    </div>
    
    <script>
        async function checkPermissions() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="status info">⏳ Verificando...</div>';
            
            try {
                // Get current user info
                const response = await fetch('/api/user', { credentials: 'include' });
                
                if (!response.ok) {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            <h3>❌ Não Autenticado</h3>
                            <p>Você precisa fazer login primeiro.</p>
                            <p><strong>Ação:</strong> Faça login no sistema e tente novamente.</p>
                        </div>
                    `;
                    return;
                }
                
                const user = await response.json();
                
                // Check user role
                const isAdmin = ['admin', 'superadmin', 'manager'].includes(user.role);
                const hasRestaurant = !!user.restaurantId;
                
                let html = '<div class="data">';
                html += `<strong>📧 Email:</strong> ${user.email}<br>`;
                html += `<strong>👤 Nome:</strong> ${user.firstName || 'N/A'} ${user.lastName || ''}<br>`;
                html += `<strong>🎭 Role:</strong> ${user.role}<br>`;
                html += `<strong>🏢 Restaurant ID:</strong> ${user.restaurantId || 'NÃO ASSOCIADO'}<br>`;
                html += '</div>';
                
                // Analyze problems
                if (!isAdmin) {
                    html += `
                        <div class="status error">
                            <h3>❌ Sem Permissões de Admin</h3>
                            <p>Seu usuário tem role: <strong>${user.role}</strong></p>
                            <p>Para acessar a página de Usuários, você precisa ser:</p>
                            <ul>
                                <li>✓ admin</li>
                                <li>✓ manager</li>
                                <li>✓ superadmin</li>
                            </ul>
                            <p><strong>Solução:</strong> Peça a um administrador para alterar seu role para "admin" ou "manager".</p>
                        </div>
                    `;
                } else if (!hasRestaurant && user.role !== 'superadmin') {
                    html += `
                        <div class="status error">
                            <h3>⚠️ Usuário Sem Restaurante</h3>
                            <p>Você é <strong>${user.role}</strong> mas não está associado a nenhum restaurante.</p>
                            <p><strong>Solução:</strong> Um superadmin precisa associar você a um restaurante.</p>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="status success">
                            <h3>✅ Permissões OK!</h3>
                            <p>Você tem as permissões necessárias para acessar a página de Usuários.</p>
                            <p><strong>Role:</strong> ${user.role}</p>
                            ${user.restaurantId ? `<p><strong>Restaurante:</strong> ${user.restaurantId}</p>` : ''}
                        </div>
                    `;
                    
                    // Now check subscription
                    html += '<div class="status info" style="margin-top: 20px;">';
                    html += '<h4>🔍 Verificando subscrição do restaurante...</h4>';
                    html += '</div>';
                    
                    // Try to access users endpoint
                    const usersTest = await fetch('/api/users?page=1&limit=1', { credentials: 'include' });
                    
                    if (usersTest.ok) {
                        html += `
                            <div class="status success">
                                <h3>🎉 Tudo Funcionando!</h3>
                                <p>Você pode acessar a página de Usuários normalmente.</p>
                                <p>Se ainda estiver travando, pode ser um problema no frontend. Tente:</p>
                                <ul>
                                    <li>Limpar o cache do navegador (Ctrl + Shift + Del)</li>
                                    <li>Fazer hard refresh (Ctrl + Shift + R)</li>
                                    <li>Abrir em aba anônima</li>
                                </ul>
                            </div>
                        `;
                    } else {
                        const errorData = await usersTest.json().catch(() => ({}));
                        html += `
                            <div class="status error">
                                <h3>❌ Erro ao Acessar API de Usuários</h3>
                                <p><strong>Status:</strong> ${usersTest.status}</p>
                                <p><strong>Mensagem:</strong> ${errorData.message || 'Erro desconhecido'}</p>
                                ${errorData.code ? `<p><strong>Código:</strong> ${errorData.code}</p>` : ''}
                                ${usersTest.status === 402 ? `
                                    <p style="margin-top: 15px;">
                                        <strong>💡 Solução:</strong> Há um problema com a subscrição do restaurante.
                                    </p>
                                    <button class="fix-button" onclick="window.location.href='/fix-subscriptions.html'">
                                        🔧 Corrigir Subscrição
                                    </button>
                                ` : ''}
                            </div>
                        `;
                    }
                }
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">
                        <h3>❌ Erro</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
